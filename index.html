<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do Not Press The Button</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/app.js"></script>
</head>

<body>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">☀️</button>
    <div class="game-container">

        <div class="game-instruction">
            <h3>Game Instructions</h3>
            <p id="instructions-text">Read the dialogue box carefully. Follow the commands, solve the prompts, and race against the ticking clock. Whatever you do... obey the button's rules before your time runs out!</p>
        </div>

        <div id="timer-display" class="timer-text">Time Left: 10s</div>

        <div class="dialogue-box">
            <p id="dialogue-text">Do not Click The Button</p>
        </div>

        <div id="game-interaction-area">
            <button id="main-button" class="tempting-button">CLICK</button>
        </div>
    </div>
</body>

</html>
